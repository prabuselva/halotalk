[workspace]
resolver = "2"
members = ["crates/halo-core", "crates/halo-providers", "crates/halo-server"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chacha20poly1305 = "0.10"
getrandom = "0.2"
futures = "0.3"
mime_guess = "2"
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "stream", "multipart", "rustls", "webpki-roots"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "chrono", "derive", "macros"] }
tokio = { version = "1.54", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7"] }

halo-core = { path = "crates/halo-core" }
halo-providers = { path = "crates/halo-providers" }

[profile.release]
lto = "thin"
